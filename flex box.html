<head>
    <title> All Flexbox </title>
    <style>
        .container {
            display:flex;
            flex-direction:column;
            gap: 10px;
            background-color: lightgray;
            padding: 20px;
        }

        .box {
            background-color: steelblue;
            color: white;
            padding: 20px;
            text-align:center;
        }
    </style>
  <body>
    <div class="container">
      <div class="box">Box 1</div>
      <div class="box">Box 2</div>
      <div class="box">Box 3</div>
    </div>
  </body>
</head>
